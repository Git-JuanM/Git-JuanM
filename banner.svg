<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Juan Pablo Mejía Girón — Analista de Datos y Machine Learning</title>
  <desc id="d">Banner con el nombre, el rol, las tecnologías principales y una curva ROC con AUC 0,84.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#0f2230"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9fb3c8" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- Texto -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <rect x="64" y="62" width="34" height="3" rx="1.5" fill="#f5b942"/>
      <text x="64" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.4" fill="#2dd4bf">ANALISTA DE DATOS · MACHINE LEARNING</text>
      <text x="64" y="152" font-size="50" font-weight="700" letter-spacing="-0.8" fill="#f2f6fa">Juan Pablo Mejía Girón</text>
      <text x="64" y="190" font-size="20" fill="#a9b8c8">Datos, reportes y modelos para decidir mejor · Medellín, Colombia</text>

      <!-- Tecnologías -->
      <g font-size="14" font-weight="600" fill="#d6e2ee" text-anchor="middle">
        <g fill="#ffffff" fill-opacity="0.05" stroke="#9fb3c8" stroke-opacity="0.28">
          <rect x="64"  y="218" width="78"  height="30" rx="15"/>
          <rect x="152" y="218" width="56"  height="30" rx="15"/>
          <rect x="218" y="218" width="94"  height="30" rx="15"/>
          <rect x="322" y="218" width="152" height="30" rx="15"/>
          <rect x="484" y="218" width="112" height="30" rx="15"/>
          <rect x="606" y="218" width="60"  height="30" rx="15"/>
        </g>
        <text x="103" y="238">Python</text>
        <text x="180" y="238">SQL</text>
        <text x="265" y="238">Power BI</text>
        <text x="398" y="238">Machine Learning</text>
        <text x="540" y="238">LLMs · RAG</text>
        <text x="636" y="238">AWS</text>
      </g>
    </g>

    <!-- Curva ROC -->
    <g>
      <g stroke="#9fb3c8" stroke-opacity="0.14" stroke-width="1">
        <line x1="840" y1="200" x2="1120" y2="200"/>
        <line x1="840" y1="150" x2="1120" y2="150"/>
        <line x1="840" y1="100" x2="1120" y2="100"/>
        <line x1="840" y1="50"  x2="1120" y2="50"/>
        <line x1="910"  y1="50" x2="910"  y2="250"/>
        <line x1="980"  y1="50" x2="980"  y2="250"/>
        <line x1="1050" y1="50" x2="1050" y2="250"/>
        <line x1="1120" y1="50" x2="1120" y2="250"/>
      </g>
      <path d="M840 50 V250 H1120" fill="none" stroke="#9fb3c8" stroke-opacity="0.55" stroke-width="1.5"/>
      <line x1="840" y1="250" x2="1120" y2="50" stroke="#9fb3c8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 6"/>

      <path d="M840 250 C844 205 852 160 868 136 S906 96 924 84 S1000 61 1036 56 S1096 51 1120 50 V250 Z" fill="url(#area)"/>
      <path d="M840 250 C844 205 852 160 868 136 S906 96 924 84 S1000 61 1036 56 S1096 51 1120 50" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>

      <circle cx="924" cy="84" r="9" fill="#f5b942" fill-opacity="0.22"/>
      <circle cx="924" cy="84" r="4.5" fill="#f5b942"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="958" y="150" width="124" height="46" rx="8" fill="#0b1320" fill-opacity="0.85" stroke="#2dd4bf" stroke-opacity="0.45"/>
        <text x="1020" y="170" font-size="11" letter-spacing="1.6" fill="#a9b8c8" text-anchor="middle">CURVA ROC</text>
        <text x="1020" y="188" font-size="15" font-weight="700" fill="#f2f6fa" text-anchor="middle">AUC 0,84</text>
        <text x="980" y="272" font-size="11" letter-spacing="1.4" fill="#7f91a4" text-anchor="middle">FALSOS POSITIVOS</text>
      </g>
    </g>
  </g>
</svg>
